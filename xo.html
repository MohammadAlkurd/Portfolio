<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151c" />
    <meta name="description" content="XO — a playable tic-tac-toe game by Mohammed Kord. Play against a friend or the computer." />
    <link rel="icon" type="image/svg+xml" href="/Portfolio/favicon.svg" />
    <title>XO | Mohammed Kord</title>
  </head>
  <body>
    <script>
      (() => {
        const stored = localStorage.getItem('theme');
        const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/xo/main.tsx"></script>
  </body>
</html>
